services:
  db:
    image: postgres:16-alpine
    container_name: concerts_afisha_pg_db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: concerts_afisha_db
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concerts_afisha_backend
    restart: always
    environment:
      APP_ENV: ${APP_ENV}
      PYTHONPATH: /app/src
      DATABASE_URL: ${DATABASE_URL}
      HASH_SCHEME: ${HASH_SCHEME}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM}
      PORT: ${PORT}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_LOGIN: ${ADMIN_LOGIN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8001:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: concerts_afisha_frontend
    restart: always
    ports:
      - "5174:5173"
    depends_on:
      - backend

volumes:
  pgdata: